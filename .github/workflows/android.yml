name: Android-App bauen

# Baut die Android-App (Trusted Web Activity) und stellt sie als Release "android" bereit.
# Neue App-Inhalte brauchen KEINEN neuen Build: die App lädt sie von GitHub Pages.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Signatur-Schlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 fehlt (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rechenheld.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/rechenheld.keystore" >> "$GITHUB_ENV"

      - name: APK bauen
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Rechenheld.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Rechenheld-apk
          path: Rechenheld.apk

      - name: Als Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android --yes --cleanup-tag || true
          gh release create android Rechenheld.apk \
            --title "Android-App (Build ${{ github.run_number }})" \
            --notes "Rechenheld.apk auf dem Tablet herunterladen und öffnen. Neue Aufgaben und Funktionen kommen automatisch über die Web-App, ein neuer Download ist nur selten nötig."
